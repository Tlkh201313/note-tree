  --k-preference: #94c9a3;

/* note-tree — the tree page.
 *
 * Inlined into a single HTML file, so it must stay small and load with no
 * network at all: no web fonts, no icon set, no framework. Everything is system
 * fonts, CSS custom properties, and one SVG.
 *
 * Two themes, picked by the clock rather than by a setting nobody changes: warm
 * paper by day, warm ink by night. The palette is deliberately narrow — paper,
 * ink, one accent, and the seven kind colours, which are generated from
 * src/theme.mjs so the browser and the terminal can't drift apart.
 */

:root {
  /* Day — paper, and paper means rice paper rather than printer paper. The
   * first pass used #faf9f5, which reads as white on a bright screen; this is
   * the same hue family pushed far enough into cream that the page feels warm
   * next to a white browser chrome, without tipping into yellow. */
  --paper: #f6f3e9;
  --paper-soft: #ece7d8;
  --panel: #fbf9f2;
  --ink: #3d3929;
  --ink-dim: #6b6759;
  --ink-faint: #93907f;
  --line: #ddd8c6;
  --line-soft: #e7e2d3;
  --accent: #c96442;
  /* Stem and root, one muted sage. A botanical plate draws the whole plant in
   * a single ink and lets the specimen carry the interest — here that's the
   * leaves, whose colour is the one thing on the page carrying data. A brown
   * trunk competed with them and made the tree look like a cartoon. */
  --bark: #8d9377;
  --bark-dim: #a3a891;
  --vein: rgba(61, 57, 41, 0.16);
  /* The pinned mark. A bright gold face inside a dark rim, so the sparkle keeps
   * its edge on a pale gotcha leaf and its glow on a dark archived one — read by
   * luminance, not hue, which is what makes it colour-blind safe. */
  --pin: #f2ce5e;
  --pin-edge: #4a3a12;
  --shadow: 0 12px 34px rgba(61, 57, 41, 0.1);
  --shadow-soft: 0 2px 10px rgba(61, 57, 41, 0.06);
  --selection: rgba(201, 100, 66, 0.16);

  --radius: 10px;
  --sidebar: 428px;
  --header: 54px;
  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --serif: ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --mono: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace;
  color-scheme: light;
}

:root[data-theme='night'] {
  /* Night — the same page, lights down. Warm greys, never blue-black. */
  --paper: #262624;
  --paper-soft: #201f1e;
  --panel: #30302e;
  --ink: #f5f4ef;
  --ink-dim: #b5b2a9;
  --ink-faint: #85837b;
  --line: #3b3a37;
  --line-soft: #333230;
  --accent: #d97757;
  --bark: #79805f;
  --bark-dim: #656b50;
  --vein: rgba(0, 0, 0, 0.22);
  --pin: #f2ce5e;
  --pin-edge: #3a2e10;
  --shadow: 0 14px 38px rgba(0, 0, 0, 0.4);
  --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.24);
  --selection: rgba(217, 119, 87, 0.24);
  color-scheme: dark;
}

* { box-sizing: border-box; }
::selection { background: var(--selection); }

/* The UA sheet's `[hidden] { display: none }` loses to any id or class rule
 * that sets `display`, so `el.hidden = true` silently did nothing — which is
 * how "Nothing planted yet." ended up sitting on top of a tree full of leaves.
 * One declaration, ahead of everything, so the attribute always wins. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { overflow-x: hidden; }

/* Theme changes shouldn't strobe. Colours cross-fade; nothing moves. */
html, body, header, #sidebar, #tip, .leaf, .trunk, .branch, .root {
  transition: background-color 380ms ease, color 380ms ease, fill 380ms ease,
    stroke 380ms ease, border-color 380ms ease;
}
@media (prefers-reduced-motion: reduce) {
  html, body, header, #sidebar, #tip, .leaf, .trunk, .branch, .root { transition: none; }
}

/* ---------------------------------------------------------------- chrome -- */

/* `body > header`, not `header`.
 *
 * The sidebar has a header too, and it was inheriting this one's `z-index: 20`.
 * A static element normally ignores z-index — but the sidebar is a flex
 * container, and z-index *does* apply to flex items whatever their position. So
 * the sidebar's header quietly became a stacking context above the close
 * button, and the × was unclickable no matter how much z-index it was given.
 * Scoping the rule means nothing inside the sidebar can inherit page chrome. */
body > header {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--header);
  padding: 0 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px) saturate(1.1);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 7px;
  font-family: var(--serif);
  font-size: 16px;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.brand .leaf { color: var(--k-preference); font-size: 13px; }
.brand small {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0;
}

.stat {
  color: var(--ink-faint);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stat b { color: var(--ink-dim); font-weight: 550; }
.stat .sep { opacity: 0.4; margin: 0 2px; }

.spacer { margin-left: auto; }

button, .tab {
  font: inherit;
  font-size: 13px;
  color: var(--ink-dim);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 130ms, color 130ms, border-color 130ms;
}
button:hover, .tab:hover { color: var(--ink); background: var(--paper-soft); }
button:active, .tab:active { scale: 0.96; }
button:focus-visible, .tab:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* The tabs are the one header item whose width is content — one per scope, each
 * as wide as a project slug. Everything else is fixed. So the tabs are what
 * absorbs a narrow screen: `min-width: 0` lets the flex item shrink below its
 * content (it won't, by default), and the overflow scrolls instead of shoving
 * the trailing buttons off the page.
 *
 * Without this, a 390px phone laid the header out 525px wide and `body`'s
 * `overflow-x: hidden` quietly ate the last three controls — list view, the
 * theme toggle and the live indicator were not merely off-screen but
 * unreachable, with no scroll to bring them back. */
.tabs {
  display: flex;
  gap: 2px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab[aria-selected='true'] {
  color: var(--ink);
  background: var(--paper-soft);
  border-color: var(--line);
}
.tab .stat { margin-left: 5px; }

#search {
  font: inherit;
  font-size: 13px;
  width: 150px;
  padding: 5px 10px;
  color: var(--ink);
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  transition: width 160ms ease, border-color 130ms;
}
#search::placeholder { color: var(--ink-faint); }
#search:focus { width: 210px; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

.live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--ink-faint);
  padding-left: 2px;
}
.live::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--k-preference);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--k-preference) 55%, transparent);
  animation: pulse 2.6s ease-out infinite;
}
.live[data-state='off']::before { background: var(--ink-faint); animation: none; box-shadow: none; }
@keyframes pulse {
  70% { box-shadow: 0 0 0 6px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ------------------------------------------------------------------ tree -- */

main { padding-top: var(--header); }

#stage { position: relative; background: var(--paper); }

/* The whole specimen, always. `xMidYMax meet` keeps it centred and standing on
 * its ground line, so capping the height letterboxes rather than crops: a big
 * tree draws smaller instead of running off the bottom of the page. */
svg#tree { display: block; width: 100%; height: auto; max-height: calc(100vh - 58px); }

.trunk { fill: var(--bark); }
/* Branches and roots are filled tapering ribbons now, not uniform strokes —
 * thick where they leave their parent, drawn to a fine tip, so they read as
 * limbs that grew rather than rectangles laid on a curve. */
.branch { fill: var(--bark); }
.root { fill: var(--bark-dim); opacity: 0.8; }
/* The one fallback path (a stale export) is still a stroked centre line. */
.branch.stroked { fill: none; stroke: var(--bark); stroke-linecap: round; }
.root.stroked { fill: none; stroke: var(--bark-dim); stroke-linecap: round; }
/* The petiole: the same ink as the branch it grows from, one weight finer. */
.stalk { fill: none; stroke: var(--bark); stroke-linecap: round; opacity: 0.85; }
.ground { stroke: var(--line); stroke-width: 1; }

/* `scale`, never `transform`.
 *
 * Each leaf carries its position in a `transform` *attribute*, and a CSS
 * `transform` property replaces that attribute wholesale — so animating
 * `transform: scale()` here dropped the translate and rotate, and the leaf
 * jumped to the origin of the drawing and stayed there. That's the bug where
 * pinning a note made its leaf vanish until the page redrew. The independent
 * `scale` property composes with the attribute instead of replacing it. */
/* Hover must never move a leaf.
 *
 * It used to scale up by 1.16, and that fed back on itself: the leaf grew about
 * its bounding-box centre — which the long stalk pulls well off the blade — so
 * the blade slid out from under the pointer, hover ended, it shrank back under
 * the pointer, hover began again. Several times a second, with an overshoot
 * curve on top. From the outside it looked like the leaves were flying around
 * at random. Hover feedback is now purely optical: the ring, and a lift in the
 * blade's own colour. Nothing on a leaf changes its geometry on hover, ever. */
.leaf {
  cursor: pointer;
  transform-box: fill-box;
  transform-origin: center;
  transition: opacity 160ms ease;
}
.leaf .blade { transition: filter 140ms ease; }
.leaf:hover .blade, .leaf:focus-visible .blade { filter: brightness(1.15) saturate(1.08); }

/* One stable, generous hit target per leaf, and nothing else on the leaf takes
 * the pointer. Before this, the only thing you could reliably hover was the
 * 1px stroke of the selection ring. */
.leaf .hit { fill: transparent; pointer-events: all; }
.leaf .blade, .leaf .vein, .leaf .stalk, .leaf .pin, .leaf .ring { pointer-events: none; }

/* No focus box on a leaf. The browser's default — a black rounded rectangle with
 * a white halo — showed on every click and fought the drawing. The accent ring
 * is the leaf's focus *and* selection indicator, so keyboard users still get a
 * clear, on-brand focus cue; it just isn't a box. This wins over the generic
 * `[tabindex]:focus-visible` outline rule up in the chrome section. */
.leaf:focus { outline: none; }
.leaf:focus-visible { outline: none; }
.leaf:focus-visible .ring { opacity: 0.9; }
/* Named, not positional. This was `path:first-child` until a stalk was added
 * ahead of the blade and every leaf on the tree turned black. */
.leaf .blade { fill: currentColor; }
.leaf .vein { stroke: var(--vein); fill: none; }
.leaf .ring { fill: none; stroke: var(--accent); opacity: 0; transition: opacity 140ms; }

.leaf[data-kind='decision'] { color: var(--k-decision); }
.leaf[data-kind='convention'] { color: var(--k-convention); }
.leaf[data-kind='gotcha'] { color: var(--k-gotcha); }
.leaf[data-kind='architecture'] { color: var(--k-architecture); }
.leaf[data-kind='preference'] { color: var(--k-preference); }
.leaf[data-kind='reference'] { color: var(--k-reference); }
.leaf[data-kind='todo'] { color: var(--k-todo); }
.leaf[data-archived='true'] { color: var(--ink-faint); }

.leaf:hover .ring, .leaf:focus-visible .ring { opacity: 0.5; }
/* Steady, not pulsing. A ring that breathes reads as something being wrong. */
.leaf[data-selected='true'] .ring { opacity: 1; }
/* The pinned sparkle. Gold face, dark rim, round joins so the points stay clean
 * at leaf scale. The element exists only on pinned leaves, so its mere presence
 * is the signal — no colour comparison required to tell pinned from not. */
.leaf .pin { fill: var(--pin); stroke: var(--pin-edge); stroke-width: 0.5; stroke-linejoin: round; paint-order: stroke; }
.leaf[data-dim='true'] { opacity: 0.1 !important; }

/* One sway, on the whole crown, hinged at the ground.
 *
 * Each branch used to carry its own — two different durations, and the leaves
 * sat in a separate layer that didn't move at all. So every branch drifted out
 * from under its own leaves and the leaves hung in mid-air on stalks reaching
 * for a branch that had walked off. Branches and leaves are now one group: they
 * can only move together, because they *are* together. */
.sway { animation: sway 17s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes sway {
  from { transform: rotate(-0.13deg); }
  to { transform: rotate(0.13deg); }
}

/* Unfurling, not popping: the blade swings out of nothing on its own stalk. */
.sprout { animation: sprout 640ms cubic-bezier(0.2, 1.3, 0.35, 1) both; }
@keyframes sprout {
  from { scale: 0; opacity: 0; }
  60% { scale: 1.28; opacity: 1; }
  to { scale: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .sway, .sprout, .live::before { animation: none !important; }
  .leaf, .leaf .blade { transition: none; }
}
:root[data-motion='off'] .sway,
:root[data-motion='off'] .sprout { animation: none !important; }

/* ---------------------------------------------------------------- replay -- */

/* Growth replay: the tree is redrawn from a seed, in the order the notes were
 * actually written. Every moving part is a stroke dash, a clip rect, a `scale`
 * or the viewBox — no layout, no reflow, and the final frame is byte-identical
 * to the tree that was already on screen. */
:root[data-replay='on'] #tree { pointer-events: none; }
:root[data-replay='on'] .sway { animation: none; }
/* The replay writes `scale` every frame; a transition on top of that would
 * smear each step into the next and lag the whole sequence. */
:root[data-replay='on'] .leaf { transition: none; }
:root[data-replay='on'] #legend, :root[data-replay='on'] #tip { opacity: 0; }

#replay-bar {
  position: fixed;
  left: 50%;
  bottom: 22px;
  z-index: 25;
  translate: -50% 0;
  display: none;
  align-items: center;
  gap: 12px;
  padding: 9px 10px 9px 16px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: var(--shadow);
  animation: rise 320ms cubic-bezier(0.2, 0.9, 0.3, 1) backwards;
}
:root[data-replay='on'] #replay-bar { display: flex; }
#replay-bar .track {
  width: min(280px, 40vw);
  height: 3px;
  border-radius: 2px;
  background: var(--line);
  overflow: hidden;
}
#replay-bar .fill { display: block; height: 100%; width: 0; background: var(--accent); }
#replay-bar .say {
  font-size: 12px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#replay-bar .say b { font-family: var(--serif); font-weight: 500; color: var(--ink); }

/* ------------------------------------------------------------ page load -- */

/* One short orchestrated entrance, then nothing moves again on its own. */
/* `backwards`, not `both`: a forwards fill would pin these properties to the
 * animation forever and quietly beat any rule that tries to change them later. */
body > header { animation: drop 420ms cubic-bezier(0.2, 0.9, 0.3, 1) backwards; }
#stage { animation: rise 620ms 90ms cubic-bezier(0.2, 0.9, 0.3, 1) backwards; }
#legend { animation: fade 700ms 320ms ease backwards; }
@keyframes drop { from { transform: translateY(-100%); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  header, #stage, #legend, #replay-bar { animation: none; }
}
:root[data-motion='off'] header,
:root[data-motion='off'] #stage,
:root[data-motion='off'] #legend { animation: none; }

/* --------------------------------------------------------------- tooltip -- */

#tip {
  position: fixed;
  z-index: 40;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -104%);
  transition: opacity 110ms, transform 150ms cubic-bezier(0.2, 0.9, 0.3, 1);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 7px 11px;
  max-width: 320px;
  box-shadow: var(--shadow-soft);
}
#tip[data-show='true'] { opacity: 1; transform: translate(-50%, -120%); }
#tip .t { font-weight: 550; display: block; line-height: 1.4; }
#tip .d { color: var(--ink-faint); font-size: 11.5px; }

/* --------------------------------------------------------------- sidebar -- */

#sidebar {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(var(--sidebar), 94vw);
  z-index: 30;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--line);
  transform: translateX(101%);
  transition: transform 240ms cubic-bezier(0.3, 0.9, 0.3, 1);
  box-shadow: var(--shadow);
}
#sidebar[data-open='true'] { transform: none; }
/* `.fresh` is stamped on every open, including opening a second note while the
 * panel is already out — the content changes, so the content re-enters. */
#sidebar.fresh header, #sidebar.fresh .meta, #sidebar.fresh .body {
  animation: rise 340ms cubic-bezier(0.2, 0.9, 0.3, 1) backwards;
}
#sidebar.fresh .meta { animation-delay: 45ms; }
#sidebar.fresh .body { animation-delay: 90ms; }
@media (prefers-reduced-motion: reduce) {
  #sidebar { transition: none; }
  #sidebar.fresh header, #sidebar.fresh .meta, #sidebar.fresh .body { animation: none; }
}

#sidebar header { padding: 20px 22px 12px; }
#sidebar .kindline {
  /* inline-flex, so this line stops at its own text instead of stretching the
   * full panel width and sitting on top of the close button. */
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
#sidebar h2 {
  margin: 9px 0 0;
  padding-right: 26px;
  font-family: var(--serif);
  font-size: 23px;
  font-weight: 500;
  line-height: 1.26;
  letter-spacing: -0.012em;
  text-wrap: balance;
}
/* The one-line summary, set as a lead paragraph: the note in a breath, before
 * you decide whether to read the body. Larger and looser than the old 13.5px,
 * because this is the line people actually read. */
#sidebar .desc {
  margin: 10px 0 0;
  color: var(--ink-dim);
  font-size: 14.5px;
  line-height: 1.6;
}
#sidebar .desc code {
  font: 0.86em/1.5 var(--mono);
  background: var(--paper-soft);
  border-radius: 5px;
  padding: 1px 5px;
}
#sidebar .meta {
  padding: 12px 22px;
  color: var(--ink-faint);
  font-size: 11.5px;
  border-bottom: 1px solid var(--line-soft);
}

/* The body is prose an agent wrote in Markdown, so it's rendered as prose:
 * proportional type at a comfortable size, real paragraphs and lists, and mono
 * reserved for the things that are actually code. Monospaced pre-wrap was fine
 * for a machine and tiring for a person. */
#sidebar .body {
  flex: 1;
  overflow: auto;
  padding: 18px 22px 26px;
  overflow-wrap: anywhere;
  font-size: 14.5px;
  line-height: 1.72;
  color: var(--ink);
}
#sidebar .body > *:first-child { margin-top: 0; }
#sidebar .body > *:last-child { margin-bottom: 0; }
#sidebar .body p { margin: 0 0 0.95em; }
#sidebar .body h3, #sidebar .body h4 {
  margin: 1.5em 0 0.45em;
  font-family: var(--serif);
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
}
#sidebar .body ul, #sidebar .body ol { margin: 0 0 0.95em; padding-left: 1.25em; }
#sidebar .body li { margin: 0.2em 0; }
#sidebar .body li::marker { color: var(--ink-faint); }
#sidebar .body blockquote {
  margin: 0 0 0.95em;
  padding: 2px 0 2px 13px;
  border-left: 2px solid var(--line);
  color: var(--ink-dim);
}
#sidebar .body code {
  font: 0.86em/1.5 var(--mono);
  background: var(--paper-soft);
  border-radius: 5px;
  padding: 1px 5px;
}
#sidebar .body pre {
  margin: 0 0 0.95em;
  padding: 11px 13px;
  overflow-x: auto;
  white-space: pre;
  background: var(--paper-soft);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
}
#sidebar .body pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
#sidebar .body a { color: var(--accent); text-underline-offset: 2px; }
#sidebar .body hr { margin: 1.4em 0; border: 0; border-top: 1px solid var(--line-soft); }
#sidebar .body strong { font-weight: 640; }
#sidebar .body .muted { color: var(--ink-faint); font-style: italic; }
#sidebar .actions {
  display: flex;
  gap: 4px;
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  background: var(--paper-soft);
}
#sidebar .actions .grow { margin-left: auto; }
/* z-index, because the kind line is a full-width flex box that reaches under
 * this button and won the hit test — the × was clickable from code and dead to
 * a mouse. The larger padding is a real target, not a 15px glyph. */
#sidebar .close {
  position: absolute;
  top: 10px;
  right: 12px;
  z-index: 2;
  padding: 6px 10px;
  font-size: 16px;
  line-height: 1;
}

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ink-faint); }
.dot[data-kind='decision'] { background: var(--k-decision); }
.dot[data-kind='convention'] { background: var(--k-convention); }
.dot[data-kind='gotcha'] { background: var(--k-gotcha); }
.dot[data-kind='architecture'] { background: var(--k-architecture); }
.dot[data-kind='preference'] { background: var(--k-preference); }
.dot[data-kind='reference'] { background: var(--k-reference); }
.dot[data-kind='todo'] { background: var(--k-todo); }

.tag {
  display: inline-block;
  font-size: 11px;
  color: var(--ink-dim);
  background: var(--paper-soft);
  border-radius: 999px;
  padding: 2px 9px;
  margin: 6px 4px 0 0;
}

/* ------------------------------------------------------------ list view -- */

#list { display: none; padding: 30px max(20px, 5vw) 80px; max-width: 820px; margin: 0 auto; }
:root[data-view='list'] #list { display: block; }
:root[data-view='list'] #stage { display: none; }
#list ol { list-style: none; margin: 0; padding: 0; }
#list li {
  display: flex;
  gap: 11px;
  align-items: baseline;
  padding: 10px 10px;
  border-bottom: 1px solid var(--line-soft);
  border-radius: 6px;
  cursor: pointer;
}
#list li:hover { background: var(--paper-soft); }
#list li[data-dim='true'] { display: none; }
/* A short cascade down the first screenful, then rows just appear. */
:root[data-view='list'] #list li { animation: rise 300ms cubic-bezier(0.2, 0.9, 0.3, 1) backwards; }
:root[data-view='list'] #list li:nth-child(1) { animation-delay: 0ms; }
:root[data-view='list'] #list li:nth-child(2) { animation-delay: 26ms; }
:root[data-view='list'] #list li:nth-child(3) { animation-delay: 52ms; }
:root[data-view='list'] #list li:nth-child(4) { animation-delay: 78ms; }
:root[data-view='list'] #list li:nth-child(5) { animation-delay: 104ms; }
:root[data-view='list'] #list li:nth-child(n + 6) { animation-delay: 130ms; }
@media (prefers-reduced-motion: reduce) {
  :root[data-view='list'] #list li { animation: none; }
}
#list .title { flex: 1; }
#list .when { color: var(--ink-faint); font-size: 11.5px; white-space: nowrap; }
#list h3 {
  margin: 26px 0 4px;
  font-size: 11.5px;
  color: var(--ink-faint);
  font-weight: 550;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
#list h3:first-child { margin-top: 0; }

/* -------------------------------------------------------------- legend --- */

#legend {
  position: fixed;
  left: 16px;
  bottom: 14px;
  z-index: 15;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  max-width: 44vw;
  font-size: 11px;
  color: var(--ink-faint);
}
#legend span { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
#legend span:hover { color: var(--ink-dim); }
#legend span[data-off='true'] { opacity: 0.3; }

/* Shown only when the stage says so. Default is gone, so the failure mode is
 * an invisible empty-state, never an invisible tree. */
#empty { display: none; }
#stage[data-empty='true'] #empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  gap: 10px;
  color: var(--ink-faint);
  /* It covers the whole stage, so it must never be what the pointer hits. */
  pointer-events: none;
}
#stage[data-empty='true'] #empty code { pointer-events: auto; }
#empty .big { font-family: var(--serif); font-size: 20px; color: var(--ink-dim); }
#empty .hint { font-size: 13px; color: var(--ink-faint); max-width: 34ch; line-height: 1.5; }
#empty code {
  font: 12.5px var(--mono);
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 5px 10px;
  border-radius: 7px;
  color: var(--ink-dim);
}

/* A bare 0-note trunk carries no information — hide it, hold the stage open,
 * and let the seedling below be the whole picture. The tree returns the instant
 * the first leaf is saved and `data-empty` flips back to false. */
#stage[data-empty='true'] { min-height: calc(100vh - var(--header)); }
#stage[data-empty='true'] #tree { display: none; }

/* A first tree, before there is one: a single seedling breaking soil, so an
 * empty page still shows the promise of the thing rather than a blank field.
 * Drawn from the same palette as the grown tree — bark stem, two kind-coloured
 * leaves, an accent bud — and it sways at the slow pace the crown does. The
 * sway lives on the <svg> itself, which carries no positioning transform, so it
 * can't clobber the per-leaf placement the way an animation on a leaf would. */
#empty .seedling { overflow: visible; transform-origin: 60px 94px; margin-bottom: 4px; }
#empty .seedling .soil { stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; }
#empty .seedling .mound { stroke: var(--line-soft); stroke-width: 2; fill: none; }
#empty .seedling .stem,
#empty .seedling .twig { stroke: var(--bark); fill: none; stroke-linecap: round; }
#empty .seedling .stem { stroke-width: 3; }
#empty .seedling .twig { stroke-width: 2.2; }
#empty .seedling .leaf.a ellipse { fill: var(--k-preference); }
#empty .seedling .leaf.b ellipse { fill: var(--k-gotcha); }
#empty .seedling .bud { fill: var(--accent); }
.seedling { animation: seedling-sway 11s ease-in-out infinite alternate; }
@keyframes seedling-sway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.4deg); } }
@media (prefers-reduced-motion: reduce) { #empty .seedling { animation: none !important; } }
:root[data-motion='off'] #empty .seedling { animation: none !important; }

@media (max-width: 820px) {
  #legend, .stat, #search { display: none; }

}

/* Phone. Every control has to stay on screen and stay tappable, so what goes is
 * the label that repeats what the page already shows: the live/static badge.
 * The buttons themselves only tighten — they never shrink below a finger. */
@media (max-width: 560px) {

  .live { display: none; }
  button, .tab { padding: 5px 8px; }

/* Before first paint, or the page flashes the wrong theme on every load.
 * Day and night come from the clock on whatever machine is looking at the
 * page — no geolocation, no setting to find, right by default in either half
 * of the world. An explicit choice, once made, wins until it's cleared. */
(function () {
  var r = document.documentElement, saved = null;
  try { saved = localStorage.getItem('note-tree:theme'); } catch (e) {}
  var mode = saved === 'day' || saved === 'night' || saved === 'auto' ? saved : "auto";
  var h = new Date().getHours();
  r.dataset.themeMode = mode;
  r.dataset.theme = mode === 'auto' ? (h >= 7 && h < 19 ? 'day' : 'night') : mode;
})();

02.69 L 497.77 407.72 Z"},{"id":"demo-11","index":10,"side":1,"x0":500,"y0":255.5,"x1":645.6258493933559,"y1":180.5,"width":3.6399999999999997,"cx":563.639877176678,"cy":210.661561984,"count":3,"agents":["codex"],"first":1786543031614,"last":1786548671614,"project":null,"d":"M 500 255.5 Q 563.64 210.66 645.63 180.5","fill":"M 501.64 257.82 L 508.68 252.84 L 515.83 247.94 L 523.1 243.13 L 530.48 238.4 L 537.98 233.77 L 545.6 229.21 L 553.32 224.75 L 561.17 220.37 L 569.12 216.08 L 577.2 211.87 L 585.38 207.74 L 593.68 203.7 L 602.1 199.75 L 610.63 195.87 L 619.27 192.07 L 628.02 188.35 L 636.88 184.69 L 645.82 181.02 L 645.44 179.98 L 636.27 183.1 L 627.25 186.41 L 618.35 189.85 L 609.56 193.39 L 600.89 197.03 L 592.33 200.77 L 583.88 204.61 L 575.55 208.55 L 567.33 212.59 L 559.22 216.72 L 551.22 220.94 L 543.33 225.26 L 535.56 229.68 L 527.9 234.19 L 520.34 238.79 L 512.91 243.49 L 505.58 248.29 L 498.36 253.18 Z"}],"leaves":[{"id":"odisbw","title":"Migrations are additive for one release, destructive in the next","desc":"Add the column, backfill, ship, then drop the old one — never in one deploy.","kind":"convention","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T09:39:00.000Z","updated":"2026-07-02T09:39:00.000Z","tags":["db","migrations"],"pinned":true,"archived":false,"reads":3,"color":"#9db4d8","x":591.18,"y":949.46,"r":11.566666666666666,"opacity":0.8947552083333333,"angle":112.13,"stemX":578.54,"stemY":933.76,"branch":"demo-00","t":0.44,"body":"A deploy is never atomic across instances, so old and new code run side by side for a few minutes. Anything that drops or renames in the same release as the code change causes a short window of 500s."},{"id":"odipt7","title":"The worker never talks to the database directly","desc":"All writes go through the API so validation and audit live in one place.","kind":"architecture","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T10:26:00.000Z","updated":"2026-07-02T10:26:00.000Z","tags":["workers","boundaries"],"pinned":false,"archived":false,"reads":5,"color":"#b7a3dd","x":568.95,"y":921.84,"r":8.333333333333334,"opacity":0.8948368055555556,"angle":-9.77,"stemX":578.54,"stemY":933.76,"branch":"demo-00","t":0.44,"body":"Background jobs call the same HTTP API as clients, with a service token. It costs a round trip and buys a single validation path, one audit log, and the ability to change the schema without redeploying workers in lockstep."},{"id":"odil9t","title":"We store timestamps as UTC ISO strings, never epoch integers","desc":"Readability in the store beat 8 bytes per row; reversed in 2024 and regretted.","kind":"decision","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T11:13:00.000Z","updated":"2026-07-02T11:13:00.000Z","tags":["data","time"],"pinned":false,"archived":false,"reads":7,"color":"#86b8d9","x":693.79,"y":874.57,"r":9.466666666666667,"opacity":0.8949184027777778,"angle":120.18,"stemX":685.1,"stemY":859.96,"branch":"demo-00","t":0.96,"body":"Notes, events and audit rows all use `2026-01-04T09:12:00Z`. We tried epoch millis for a quarter; every debugging session started with a conversion, and two bugs came from seconds-vs-millis confusion.\n\nIf you need to sort, ISO-8601 UTC sorts lexicographically anyway."},{"id":"odi6je","title":"Pagination is cursor-based, not offset","desc":"The /orchards endpoint ignores ?page and silently returns page 1.","kind":"gotcha","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T12:00:00.000Z","updated":"2026-07-02T12:00:00.000Z","tags":["api","pagination"],"pinned":false,"archived":false,"reads":0,"color":"#e3a857","x":677.68,"y":847.5,"r":7.800000000000001,"opacity":0.895,"angle":-1.71,"stemX":685.1,"stemY":859.96,"branch":"demo-00","t":0.96,"body":"Every list endpoint takes `?cursor=` and returns `next_cursor`. Passing `?page=2` is not an error — it is ignored, and you get page 1 again, which looks like a caching bug for about an hour.\n\nUse the cursor from the previous response, and stop when `next_cursor` is null."},{"id":"odiv3i","title":"Prefer explaining the why in the PR body, not in comments","desc":"Code comments say what is surprising; PRs carry the reasoning and alternatives.","kind":"preference","scope":"project","session":"demo-01","project":null,"agent":"claude","created":"2026-07-07T19:52:05.515Z","updated":"2026-07-07T19:52:05.515Z","tags":["review"],"pinned":false,"archived":false,"reads":1,"color":"#94c9a3","x":417.45,"y":951.97,"r":8.016666666666667,"opacity":0.9083196040219907,"angle":-112.92,"stemX":426.58,"stemY":940.29,"branch":"demo-01","t":0.44,"body":"Comments age with the line they sit on. Reasoning about alternatives belongs where it stays findable and dated: the pull request, linked from the commit."},{"id":"odj12z","title":"No background daemon, ever","desc":"Startup cost must be one process that exits, not a service that lingers.","kind":"decision","scope":"project","session":"demo-01","project":null,"agent":"claude","created":"2026-07-07T22:13:05.515Z","updated":"2026-07-07T22:13:05.515Z","tags":["performance"],"pinned":false,"archived":false,"reads":6,"color":"#86b8d9","x":437.05,"y":926.9,"r":9.466666666666667,"opacity":0.9085643956886574,"angle":8.97,"stemX":426.58,"stemY":940.29,"branch":"demo-01","t":0.44,"body":"A resident worker means a port, a lifecycle, a crash path and a thing to explain in the README. Everything here is designed so the hot path is a single short-lived process reading one JSON file."},{"id":"odiydf","title":"The test suite needs a fake HOME, not just a temp data dir","desc":"Adapters resolve config paths from os.homedir() at import time.","kind":"gotcha","scope":"project","session":"demo-01","project":null,"agent":"claude","created":"2026-07-07T23:00:05.515Z","updated":"2026-07-07T23:00:05.515Z","tags":["testing"],"pinned":false,"archived":false,"reads":8,"color":"#e3a857","x":317.76,"y":889.58,"r":10.6,"opacity":0.9086459929108797,"angle":-120.94,"stemX":327.12,"stemY":873.39,"branch":"demo-01","t":0.96,"body":"Redirecting the data root is not enough: anything that resolves `~/.config` does so from `os.homedir()`, which reads `USERPROFILE`/`HOME` when the process starts. Set both in the test harness, or a test run edits your real settings."},{"id":"odj933","title":"Windows paths need lowercasing before hashing","desc":"C:\\Foo and c:\\foo are the same directory but hash differently.","kind":"gotcha","scope":"project","session":"demo-02","project":null,"agent":"codex","created":"2026-07-12T23:54:32.532Z","updated":"2026-07-12T23:54:32.532Z","tags":["windows","paths"],"pinned":false,"archived":false,"reads":0,"color":"#e3a857","x":585.67,"y":800.69,"r":7.800000000000001,"opacity":0.9212405246527777,"angle":113.83,"stemX":577.03,"stemY":789.28,"branch":"demo-02","t":0.44,"body":"Any identifier derived from an absolute path has to normalise case on Windows, or the same folder gets two identities depending on how the shell spelled it that day."},{"id":"odj7ec","title":"Error responses always carry a stable `code`","desc":"Clients switch on `code`, never on the human-readable `message`.","kind":"convention","scope":"project","session":"demo-02","project":null,"agent":"codex","created":"2026-07-13T00:41:32.532Z","updated":"2026-07-13T00:41:32.532Z","tags":["api","errors"],"pinned":false,"archived":false,"reads":2,"color":"#9db4d8","x":567.49,"y":776.67,"r":8.806366042640228,"opacity":0.9213221218750001,"angle":-8.06,"stemX":577.03,"stemY":789.28,"branch":"demo-02","t":0.44,"body":"`{\"code\":\"orchard.not_found\",\"message\":\"…\"}`. The message is free to change and is translated; the code is part of the contract and needs a deprecation cycle."},{"id":"odj4pl","title":"Staging credentials live in 1Password, vault \"Orchard / staging\"","desc":"Rotated monthly; the CI copy is a separate service account.","kind":"reference","scope":"project","session":"demo-02","project":null,"agent":"codex","created":"2026-07-13T01:28:32.532Z","updated":"2026-07-13T01:28:32.532Z","tags":["ops","secrets"],"pinned":false,"archived":false,"reads":4,"color":"#a3a096","x":687.75,"y":733.25,"r":7.2,"opacity":0.9214037190972222,"angle":121.81,"stemX":681.22,"stemY":721.54,"branch":"demo-02","t":0.96,"body":"Ask in #orchard-eng for access. CI does not use these — it has its own account with read-only scope."},{"id":"odjkra","title":"Small PRs, even when the refactor is obviously right","desc":"Review quality falls off a cliff past about 400 changed lines.","kind":"preference","scope":"project","session":"demo-03","project":null,"agent":"claude","created":"2026-07-17T21:30:05.157Z","updated":"2026-07-17T21:30:05.157Z","tags":["review","process"],"pinned":false,"archived":false,"reads":1,"color":"#94c9a3","x":413.52,"y":791.2,"r":8.016666666666667,"opacity":0.9334897325520833,"angle":-110.13,"stemX":423.08,"stemY":780.13,"branch":"demo-03","t":0.44,"body":"Land the mechanical change on its own, then the behavioural one. Two boring reviews beat one that gets a thumbs-up nobody earned."},{"id":"odjhua","title":"Ship the CLI as one file with zero dependencies","desc":"Install time and supply-chain surface both go to roughly zero.","kind":"decision","scope":"project","session":"demo-03","project":null,"agent":"claude","created":"2026-07-17T22:17:05.157Z","updated":"2026-07-17T22:17:05.157Z","tags":["packaging"],"pinned":false,"archived":false,"reads":3,"color":"#86b8d9","x":433.97,"y":767.53,"r":9.366666666666667,"opacity":0.9335713297743056,"angle":11.76,"stemX":423.08,"stemY":780.13,"branch":"demo-03","t":0.44,"body":"No dependencies means no install step, no native build, no audit noise, and a cold start dominated by Node itself. It costs us a few hundred lines of utility code, which we would have read anyway."},{"id":"odjfw7","title":"Rate-limit headers are missing on the batch endpoint","desc":"Clients back off blind; add X-RateLimit-* the way the single endpoint does.","kind":"todo","scope":"project","session":"demo-03","project":null,"agent":"claude","created":"2026-07-17T23:04:05.157Z","updated":"2026-07-17T23:04:05.157Z","tags":["api","todo"],"pinned":false,"archived":false,"reads":5,"color":"#e39182","x":310.17,"y":714.86,"r":8.333333333333334,"opacity":0.9336529269965278,"angle":-118.28,"stemX":318.32,"stemY":702.15,"branch":"demo-03","t":0.96,"body":"Single-resource endpoints return the standard trio. `/batch` returns none, so clients guess. Low effort, high annoyance."},{"id":"odjdch","title":"Search is trigram-based, not embeddings","desc":"Good enough for a few thousand short records, and it has no model to load.","kind":"architecture","scope":"project","session":"demo-03","project":null,"agent":"claude","created":"2026-07-17T23:51:05.157Z","updated":"2026-07-17T23:51:05.157Z","tags":["search"],"pinned":false,"archived":false,"reads":7,"color":"#b7a3dd","x":326.47,"y":689.43,"r":8.333333333333334,"opacity":0.93373452421875,"angle":3.61,"stemX":318.32,"stemY":702.15,"branch":"demo-03","t":0.96,"body":"Titles and tags are matched with a Dice coefficient over character trigrams. It handles typos, needs no index build, and adds nothing to startup. Semantic search is a roadmap item, not a dependency."},{"id":"odk0a5","title":"We store timestamps as UTC ISO strings, never epoch integers (2)","desc":"Readability in the store beat 8 bytes per row; reversed in 2024 and regretted.","kind":"decision","scope":"project","session":"demo-05","project":null,"agent":"codex","created":"2026-07-26T15:20:21.809Z","updated":"2026-07-26T15:20:21.809Z","tags":["data","time"],"pinned":false,"archived":false,"reads":7,"color":"#86b8d9","x":627.02,"y":613.4,"r":9.466666666666667,"opacity":0.955347853269676,"angle":115.64,"stemX":617.43,"stemY":599.84,"branch":"demo-05","t":0.84,"body":"Notes, events and audit rows all use `2026-01-04T09:12:00Z`. We tried epoch millis for a quarter; every debugging session started with a conversion, and two bugs came from seconds-vs-millis confusion.\n\nIf you need to sort, ISO-8601 UTC sorts lexicographically anyway."},{"id":"odjyvs","title":"Pagination is cursor-based, not offset (2)","desc":"The /orchards endpoint ignores ?page and silently returns page 1.","kind":"gotcha","scope":"project","session":"demo-05","project":null,"agent":"codex","created":"2026-07-26T16:07:21.809Z","updated":"2026-07-26T16:07:21.809Z","tags":["api","pagination"],"pinned":false,"archived":false,"reads":0,"color":"#e3a857","x":609.27,"y":588.33,"r":7.800000000000001,"opacity":0.9554294504918981,"angle":-6.25,"stemX":617.43,"stemY":599.84,"branch":"demo-05","t":0.84,"body":"Every list endpoint takes `?cursor=` and returns `next_cursor`. Passing `?page=2` is not an error — it is ignored, and you get page 1 again, which looks like a caching bug for about an hour.\n\nUse the cursor from the previous response, and stop when `next_cursor` is null."},{"id":"odkbbj","title":"The test suite needs a fake HOME, not just a temp data dir (2)","desc":"Adapters resolve config paths from os.homedir() at import time.","kind":"gotcha","scope":"project","session":"demo-06","project":null,"agent":"claude","created":"2026-07-30T13:08:02.423Z","updated":"2026-07-30T13:08:02.423Z","tags":["testing"],"pinned":false,"archived":false,"reads":8,"color":"#e3a857","x":419.71,"y":659.17,"r":10.6,"opacity":0.9651181256655093,"angle":-113.17,"stemX":430.93,"stemY":644.7,"branch":"demo-06","t":0.44,"body":"Redirecting the data root is not enough: anything that resolves `~/.config` does so from `os.homedir()`, which reads `USERPROFILE`/`HOME` when the process starts. Set both in the test harness, or a test run edits your real settings."},{"id":"odk8ua","title":"Prefer explaining the why in the PR body, not in comments (2)","desc":"Code comments say what is surprising; PRs carry the reasoning and alternatives.","kind":"preference","scope":"project","session":"demo-06","project":null,"agent":"claude","created":"2026-07-30T13:55:02.423Z","updated":"2026-07-30T13:55:02.423Z","tags":["review"],"pinned":false,"archived":false,"reads":1,"color":"#94c9a3","x":439.77,"y":633.29,"r":8.016666666666667,"opacity":0.9651997228877315,"angle":8.72,"stemX":430.93,"stemY":644.7,"branch":"demo-06","t":0.44,"body":"Comments age with the line they sit on. Reasoning about alternatives belongs where it stays findable and dated: the pull request, linked from the commit."},{"id":"odk56e","title":"Migrations are additive for one release, destructive in the next (2)","desc":"Add the column, backfill, ship, then drop the old one — never in one deploy.","kind":"convention","scope":"project","session":"demo-06","project":null,"agent":"claude","created":"2026-07-30T14:42:02.423Z","updated":"2026-07-30T14:42:02.423Z","tags":["db","migrations"],"pinned":false,"archived":false,"reads":3,"color":"#9db4d8","x":329.23,"y":596.64,"r":9.366666666666667,"opacity":0.9652813201099537,"angle":-121.17,"stemX":337.41,"stemY":582.36,"branch":"demo-06","t":0.96,"body":"A deploy is never atomic across instances, so old and new code run side by side for a few minutes. Anything that drops or renames in the same release as the code change causes a short window of 500s."},{"id":"odk34a","title":"The worker never talks to the database directly (2)","desc":"All writes go through the API so validation and audit live in one place.","kind":"architecture","scope":"project","session":"demo-06","project":null,"agent":"claude","created":"2026-07-30T15:29:02.423Z","updated":"2026-07-30T15:29:02.423Z","tags":["workers","boundaries"],"pinned":false,"archived":false,"reads":5,"color":"#b7a3dd","x":344.81,"y":569.42,"r":8.333333333333334,"opacity":0.9653629173321759,"angle":0.72,"stemX":337.41,"stemY":582.36,"branch":"demo-06","t":0.96,"body":"Background jobs call the same HTTP API as clients, with a service token. It costs a round trip and buys a single validation path, one audit log, and the ability to change the schema without redeploying workers in lockstep."},{"id":"odkesy","title":"No background daemon, ever (2)","desc":"Startup cost must be one process that exits, not a service that lingers.","kind":"decision","scope":"project","session":"demo-07","project":null,"agent":"claude","created":"2026-08-03T00:28:59.805Z","updated":"2026-08-03T00:28:59.805Z","tags":["performance"],"pinned":false,"archived":false,"reads":6,"color":"#86b8d9","x":570.37,"y":504.7,"r":9.466666666666667,"opacity":0.9738003415798611,"angle":107.86,"stemX":559.16,"stemY":492.72,"branch":"demo-07","t":0.44,"body":"A resident worker means a port, a lifecycle, a crash path and a thing to explain in the README. Everything here is designed so the hot path is a single short-lived process reading one JSON file."},{"id":"odkk0r","title":"Error responses always carry a stable `code` (2)","desc":"Clients switch on `code`, never on the human-readable `message`.","kind":"convention","scope":"project","session":"demo-07","project":null,"agent":"claude","created":"2026-08-03T02:49:59.805Z","updated":"2026-08-03T02:49:59.805Z","tags":["api","errors"],"pinned":false,"archived":false,"reads":2,"color":"#9db4d8","x":548.63,"y":481.46,"r":8.806366042640228,"opacity":0.9740451332465278,"angle":-14.03,"stemX":559.16,"stemY":492.72,"branch":"demo-07","t":0.44,"body":"`{\"code\":\"orchard.not_found\",\"message\":\"…\"}`. The message is free to change and is translated; the code is part of the contract and needs a deprecation cycle."},{"id":"odkhzm","title":"Staging credentials live in 1Password, vault \"Orchard / staging\" (2)","desc":"Rotated monthly; the CI copy is a separate service account.","kind":"reference","scope":"project","session":"demo-07","project":null,"agent":"claude","created":"2026-08-03T03:36:59.805Z","updated":"2026-08-03T03:36:59.805Z","tags":["ops","secrets"],"pinned":true,"archived":false,"reads":4,"color":"#a3a096","x":649.46,"y":440.76,"r":9.4,"opacity":0.97412673046875,"angle":116.1,"stemX":640.14,"stemY":427.38,"branch":"demo-07","t":0.96,"body":"Ask in #orchard-eng for access. CI does not use these — it has its own account with read-only scope."},{"id":"odktpg","title":"Rate-limit headers are missing on the batch endpoint (2)","desc":"Clients back off blind; add X-RateLimit-* the way the single endpoint does.","kind":"todo","scope":"project","session":"demo-08","project":null,"agent":"codex","created":"2026-08-06T03:03:35.864Z","updated":"2026-08-06T03:03:35.864Z","tags":["api","todo"],"pinned":false,"archived":false,"reads":5,"color":"#e39182","x":432.07,"y":508.45,"r":8.333333333333334,"opacity":0.9815687460648148,"angle":-109.61,"stemX":441.79,"stemY":497.4,"branch":"demo-08","t":0.44,"body":"Single-resource endpoints return the standard trio. `/batch` returns none, so clients guess. Low effort, high annoyance."},{"id":"odkr0c","title":"Search is trigram-based, not embeddings (2)","desc":"Good enough for a few thousand short records, and it has no model to load.","kind":"architecture","scope":"project","session":"demo-08","project":null,"agent":"codex","created":"2026-08-06T03:50:35.864Z","updated":"2026-08-06T03:50:35.864Z","tags":["search"],"pinned":false,"archived":false,"reads":7,"color":"#b7a3dd","x":451.5,"y":486.36,"r":8.333333333333334,"opacity":0.981650343287037,"angle":12.28,"stemX":441.79,"stemY":497.4,"branch":"demo-08","t":0.44,"body":"Titles and tags are matched with a Dice coefficient over character trigrams. It handles typos, needs no index build, and adds nothing to startup. Semantic search is a roadmap item, not a dependency."},{"id":"odkoc0","title":"Windows paths need lowercasing before hashing (2)","desc":"C:\\Foo and c:\\foo are the same directory but hash differently.","kind":"gotcha","scope":"project","session":"demo-08","project":null,"agent":"codex","created":"2026-08-06T04:37:35.864Z","updated":"2026-08-06T04:37:35.864Z","tags":["windows","paths"],"pinned":false,"archived":false,"reads":0,"color":"#e3a857","x":354.8,"y":448.85,"r":7.800000000000001,"opacity":0.9817319405092593,"angle":-117.78,"stemX":362.41,"stemY":437.21,"branch":"demo-08","t":0.96,"body":"Any identifier derived from an absolute path has to normalise case on Windows, or the same folder gets two identities depending on how the shell spelled it that day."},{"id":"odkzb1","title":"Small PRs, even when the refactor is obviously right (2)","desc":"Review quality falls off a cliff past about 400 changed lines.","kind":"preference","scope":"project","session":"demo-09","project":null,"agent":"claude","created":"2026-08-08T21:31:38.264Z","updated":"2026-08-08T21:31:38.264Z","tags":["review","process"],"pinned":false,"archived":false,"reads":1,"color":"#94c9a3","x":604.09,"y":340.93,"r":8.016666666666667,"opacity":0.9884924266203704,"angle":119.15,"stemX":596.69,"stemY":329,"branch":"demo-09","t":0.84,"body":"Land the mechanical change on its own, then the behavioural one. Two boring reviews beat one that gets a thumbs-up nobody earned."},{"id":"odkwdq","title":"Ship the CLI as one file with zero dependencies (2)","desc":"Install time and supply-chain surface both go to roughly zero.","kind":"decision","scope":"project","session":"demo-09","project":null,"agent":"claude","created":"2026-08-08T22:18:38.264Z","updated":"2026-08-08T22:18:38.264Z","tags":["packaging"],"pinned":false,"archived":false,"reads":3,"color":"#86b8d9","x":588.23,"y":315.35,"r":9.366666666666667,"opacity":0.9885740238425926,"angle":-2.74,"stemX":596.69,"stemY":329,"branch":"demo-09","t":0.84,"body":"No dependencies means no install step, no native build, no audit noise, and a cold start dominated by Node itself. It costs us a few hundred lines of utility code, which we would have read anyway."},{"id":"odlc6z","title":"Pagination is cursor-based, not offset (3)","desc":"The /orchards endpoint ignores ?page and silently returns page 1.","kind":"gotcha","scope":"project","session":"demo-10","project":null,"agent":"claude","created":"2026-08-11T01:52 3.18 220.68 L 560.07 216.4 L 567.06 212.19 L 574.15 208.05 L 581.35 204 L 588.64 200.01 L 596.04 196.1 L 603.54 192.26 L 611.14 188.48 L 618.83 184.75 L 626.58 181 L 626.15 180 L 618.13 183.2 L 610.26 186.59 L 602.5 190.09 L 594.84 193.68 L 587.28 197.37 L 579.82 201.15 L 572.47 205.02 L 565.22 208.98 L 558.07 213.02 L 551.02 217.15 L 544.06 221.37 L 537.21 225.67 L 530.46 230.06 L 523.82 234.53 L 517.27 239.09 L 510.82 243.74 L 504.47 248.47 L 498.22 253.28 Z"},{"id":"demo-11","index":11,"side":-1,"x0":500,"y0":255.5,"x1":354.3741506066441,"y1":180.5,"width":3.6399999999999997,"cx":436.36012282332206,"cy":210.661561984,"count":3,"agents":["codex"],"first":1786543031614,"last":1786548671614,"project":null,"d":"M 500 255.5 Q 436.36 210.66 354.37 180.5","fill":"M 501.64 253.18 L 494.42 248.29 L 487.09 243.49 L 479.66 238.79 L 472.1 234.19 L 464.44 229.68 L 456.67 225.26 L 448.78 220.94 L 440.78 216.72 L 432.67 212.59 L 424.45 208.55 L 416.12 204.61 L 407.67 200.77 L 399.11 197.03 L 390.44 193.39 L 381.65 189.85 L 372.75 186.41 L 363.73 183.1 L 354.56 179.98 L 354.18 181.02 L 363.12 184.69 L 371.98 188.35 L 380.73 192.07 L 389.37 195.87 L 397.9 199.75 L 406.32 203.7 L 414.62 207.74 L 422.8 211.87 L 430.88 216.08 L 438.83 220.37 L 446.68 224.75 L 454.4 229.21 L 462.02 233.77 L 469.52 238.4 L 476.9 243.13 L 484.17 247.94 L 491.32 252.84 L 498.36 257.82 Z"}],"leaves":[{"id":"odisbw","title":"Migrations are additive for one release, destructive in the next","desc":"Add the column, backfill, ship, then drop the old one — never in one deploy.","kind":"convention","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T09:39:00.000Z","updated":"2026-07-02T09:39:00.000Z","tags":["db","migrations"],"pinned":true,"archived":false,"reads":3,"color":"#9db4d8","x":591.18,"y":949.46,"r":11.566666666666666,"opacity":0.8947552083333333,"angle":112.13,"stemX":578.54,"stemY":933.76,"branch":"demo-00","t":0.44,"body":"A deploy is never atomic across instances, so old and new code run side by side for a few minutes. Anything that drops or renames in the same release as the code change causes a short window of 500s."},{"id":"odipt7","title":"The worker never talks to the database directly","desc":"All writes go through the API so validation and audit live in one place.","kind":"architecture","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T10:26:00.000Z","updated":"2026-07-02T10:26:00.000Z","tags":["workers","boundaries"],"pinned":false,"archived":false,"reads":5,"color":"#b7a3dd","x":568.95,"y":921.84,"r":8.333333333333334,"opacity":0.8948368055555556,"angle":-9.77,"stemX":578.54,"stemY":933.76,"branch":"demo-00","t":0.44,"body":"Background jobs call the same HTTP API as clients, with a service token. It costs a round trip and buys a single validation path, one audit log, and the ability to change the schema without redeploying workers in lockstep."},{"id":"odil9t","title":"We store timestamps as UTC ISO strings, never epoch integers","desc":"Readability in the store beat 8 bytes per row; reversed in 2024 and regretted.","kind":"decision","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T11:13:00.000Z","updated":"2026-07-02T11:13:00.000Z","tags":["data","time"],"pinned":false,"archived":false,"reads":7,"color":"#86b8d9","x":693.79,"y":874.57,"r":9.466666666666667,"opacity":0.8949184027777778,"angle":120.18,"stemX":685.1,"stemY":859.96,"branch":"demo-00","t":0.96,"body":"Notes, events and audit rows all use `2026-01-04T09:12:00Z`. We tried epoch millis for a quarter; every debugging session started with a conversion, and two bugs came from seconds-vs-millis confusion.\n\nIf you need to sort, ISO-8601 UTC sorts lexicographically anyway."},{"id":"odi6je","title":"Pagination is cursor-based, not offset","desc":"The /orchards endpoint ignores ?page and silently returns page 1.","kind":"gotcha","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T12:00:00.000Z","updated":"2026-07-02T12:00:00.000Z","tags":["api","pagination"],"pinned":false,"archived":false,"reads":0,"color":"#e3a857","x":677.68,"y":847.5,"r":7.800000000000001,"opacity":0.895,"angle":-1.71,"stemX":685.1,"stemY":859.96,"branch":"demo-00","t":0.96,"body":"Every list endpoint takes `?cursor=` and returns `next_cursor`. Passing `?page=2` is not an error — it is ignored, and you get page 1 again, which looks like a caching bug for about an hour.\n\nUse the cursor from the previous response, and stop when `next_cursor` is null."},{"id":"odiv3i","title":"Prefer explaining the why in the PR body, not in comments","desc":"Code comments say what is surprising; PRs carry the reasoning and alternatives.","kind":"preference","scope":"project","session":"demo-01","project":null,"agent":"claude","created":"2026-07-07T19:52:05.515Z","updated":"2026-07-07T19:52:05.515Z","tags":["review"],"pinned":false,"archived":false,"reads":1,"color":"#94c9a3","x":417.45,"y":951.97,"r":8.016666666666667,"opacity":0.9083196040219907,"angle":-112.92,"stemX":426.58,"stemY":940.29,"branch":"demo-01","t":0.44,"body":"Comments age with the line they sit on. Reasoning about alternatives belongs where it stays findable and dated: the pull request, linked from the commit."},{"id":"odj12z","title":"No background daemon, ever","desc":"Startup cost must be one process that exits, not a service that lingers.","kind":"decision","scope":"project","session":"demo-01","project":null,"agent":"claude","created":"2026-07-07T22:13:05.515Z","updated":"2026-07-07T22:13:05.515Z","tags":["performance"],"pinned":false,"archived":false,"reads":6,"color":"#86b8d9","x":437.05,"y":926.9,"r":9.466666666666667,"opacity":0.9085643956886574,"angle":8.97,"stemX":426.58,"stemY":940.29,"branch":"demo-01","t":0.44,"body":"A resident worker means a port, a lifecycle, a crash path and a thing to explain in the README. Everything here is designed so the hot path is a single short-lived process reading one JSON file."},{"id":"odiydf","title":"The test suite needs a fake HOME, not just a temp data dir","desc":"Adapters resolve config paths from os.homedir() at import time.","kind":"gotcha","scope":"project","session":"demo-01","project":null,"agent":"claude","created":"2026-07-07T23:00:05.515Z","updated":"2026-07-07T23:00:05.515Z","tags":["testing"],"pinned":false,"archived":false,"reads":8,"color":"#e3a857","x":317.76,"y":889.58,"r":10.6,"opacity":0.9086459929108797,"angle":-120.94,"stemX":327.12,"stemY":873.39,"branch":"demo-01","t":0.96,"body":"Redirecting the data root is not enough: anything that resolves `~/.config` does so from `os.homedir()`, which reads `USERPROFILE`/`HOME` when the process starts. Set both in the test harness, or a test run edits your real settings."},{"id":"odj933","title":"Windows paths need lowercasing before hashing","desc":"C:\\Foo and c:\\foo are the same directory but hash differently.","kind":"gotcha","scope":"project","session":"demo-02","project":null,"agent":"codex","created":"2026-07-12T23:54:32.532Z","updated":"2026-07-12T23:54:32.532Z","tags":["windows","paths"],"pinned":false,"archived":false,"reads":0,"color":"#e3a857","x":585.67,"y":800.69,"r":7.800000000000001,"opacity":0.9212405246527777,"angle":113.83,"stemX":577.03,"stemY":789.28,"branch":"demo-02","t":0.44,"body":"Any identifier derived from an absolute path has to normalise case on Windows, or the same folder gets two identities depending on how the shell spelled it that day."},{"id":"odj7ec","title":"Error responses always carry a stable `code`","desc":"Clients switch on `code`, never on the human-readable `message`.","kind":"convention","scope":"project","session":"demo-02","project":null,"agent":"codex","created":"2026-07-13T00:41:32.532Z","updated":"2026-07-13T00:41:32.532Z","tags":["api","errors"],"pinned":false,"archived":false,"reads":2,"color":"#9db4d8","x":567.49,"y":776.67,"r":8.806366042640228,"opacity":0.9213221218750001,"angle":-8.06,"stemX":577.03,"stemY":789.28,"branch":"demo-02","t":0.44,"body":"`{\"code\":\"orchard.not_found\",\"message\":\"…\"}`. The message is free to change and is translated; the code is part of the contract and needs a deprecation cycle."},{"id":"odj4pl","title":"Staging credentials live in 1Password, vault \"Orchard / staging\"","desc":"Rotated monthly; the CI copy is a separate service account.","kind":"reference","scope":"project","session":"demo-02","project":null,"agent":"codex","created":"2026-07-13T01:28:32.532Z","updated":"2026-07-13T01:28:32.532Z","tags":["ops","secrets"],"pinned":false,"archived":false,"reads":4,"color":"#a3a096","x":687.75,"y":733.25,"r":7.2,"opacity":0.9214037190972222,"angle":121.81,"stemX":681.22,"stemY":721.54,"branch":"demo-02","t":0.96,"body":"Ask in #orchard-eng for access. CI does not use these — it has its own account with read-only scope."},{"id":"odjkra","title":"Small PRs, even when the refactor is obviously right","desc":"Review quality falls off a cliff past about 400 changed lines.","kind":"preference","scope":"project","session":"demo-03","project":null,"agent":"claude","created":"2026-07-17T21:30:05.157Z","updated":"2026-07-17T21:30:05.157Z","tags":["review","process"],"pinned":false,"archived":false,"reads":1,"color":"#94c9a3","x":413.52,"y":791.2,"r":8.016666666666667,"opacity":0.9334897325520833,"angle":-110.13,"stemX":423.08,"stemY":780.13,"branch":"demo-03","t":0.44,"body":"Land the mechanical change on its own, then the behavioural one. Two boring reviews beat one that gets a thumbs-up nobody earned."},{"id":"odjhua","title":"Ship the CLI as one file with zero dependencies","desc":"Install time and supply-chain surface both go to roughly zero.","kind":"decision","scope":"project","session":"demo-03","project":null,"agent":"claude","created":"2026-07-17T22:17:05.157Z","updated":"2026-07-17T22:17:05.157Z","tags":["packaging"],"pinned":false,"archived":false,"reads":3,"color":"#86b8d9","x":433.97,"y":767 gs":["db","migrations"],"pinned":true,"archived":false,"reads":3,"color":"#9db4d8","x":591.18,"y":949.46,"r":11.566666666666666,"opacity":0.8947552083333333,"angle":112.13,"stemX":578.54,"stemY":933.76,"branch":"demo-00","t":0.44,"body":"A deploy is never atomic across instances, so old and new code run side by side for a few minutes. Anything that drops or renames in the same release as the code change causes a short window of 500s."},{"id":"odipt7","title":"The worker never talks to the database directly","desc":"All writes go through the API so validation and audit live in one place.","kind":"architecture","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T10:26:00.000Z","updated":"2026-07-02T10:26:00.000Z","tags":["workers","boundaries"],"pinned":false,"archived":false,"reads":5,"color":"#b7a3dd","x":568.95,"y":921.84,"r":8.333333333333334,"opacity":0.8948368055555556,"angle":-9.77,"stemX":578.54,"stemY":933.76,"branch":"demo-00","t":0.44,"body":"Background jobs call the same HTTP API as clients, with a service token. It costs a round trip and buys a single validation path, one audit log, and the ability to change the schema without redeploying workers in lockstep."},{"id":"odil9t","title":"We store timestamps as UTC ISO strings, never epoch integers","desc":"Readability in the store beat 8 bytes per row; reversed in 2024 and regretted.","kind":"decision","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T11:13:00.000Z","updated":"2026-07-02T11:13:00.000Z","tags":["data","time"],"pinned":false,"archived":false,"reads":7,"color":"#86b8d9","x":693.79,"y":874.57,"r":9.466666666666667,"opacity":0.8949184027777778,"angle":120.18,"stemX":685.1,"stemY":859.96,"branch":"demo-00","t":0.96,"body":"Notes, events and audit rows all use `2026-01-04T09:12:00Z`. We tried epoch millis for a quarter; every debugging session started with a conversion, and two bugs came from seconds-vs-millis confusion.\n\nIf you need to sort, ISO-8601 UTC sorts lexicographically anyway."},{"id":"odi6je","title":"Pagination is cursor-based, not offset","desc":"The /orchards endpoint ignores ?page and silently returns page 1.","kind":"gotcha","scope":"project","session":"demo-00","project":null,"agent":"claude","created":"2026-07-02T12:00:00.000Z","updated":"2026-07-02T12:00:00.000Z","tags":["api","pagination"],"pinned":false,"archived":false,"reads":0,"color":"#e3a857","x":677.68,"y":847.5,"r":7.800000000000001,"opacity":0.895,"angle":-1.71,"stemX":685.1,"stemY":859.96,"branch":"demo-00","t":0.96,"body":"Every list endpoint takes `?cursor=` and returns `next_cursor`. Passing `?page=2` is not an error — it is ignored, and you get page 1 again, which looks like a caching bug for about an hour.\n\nUse the cursor from the previous response, and stop when `next_cursor` is null."},{"id":"odiv3i","title":"Prefer explaining the why in the PR body, not in comments","desc":"Code comments say what is surprising; PRs carry the reasoning and alternatives.","kind":"preference","scope":"project","session":"demo-01","project":null,"agent":"claude","created":"2026-07-07T19:52:05.515Z","updated":"2026-07-07T19:52:05.515Z","tags":["review"],"pinned":false,"archived":false,"reads":1,"color":"#94c9a3","x":417.45,"y":951.97,"r":8.016666666666667,"opacity":0.9083196040219907,"angle":-112.92,"stemX":426.58,"stemY":940.29,"branch":"demo-01","t":0.44,"body":"Comments age with the line they sit on. Reasoning about alternatives belongs where it stays findable and dated: the pull request, linked from the commit."},{"id":"odj12z","title":"No background daemon, ever","desc":"Startup cost must be one process that exits, not a service that lingers.","kind":"decision","scope":"project","session":"demo-01","project":null,"agent":"claude","created":"2026-07-07T22:13:05.515Z","updated":"2026-07-07T22:13:05.515Z","tags":["performance"],"pinned":false,"archived":false,"reads":6,"color":"#86b8d9","x":437.05,"y":926.9
